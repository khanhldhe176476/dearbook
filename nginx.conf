server {
    listen 80;
    server_name localhost;
    charset utf-8;

    # Cho phép upload file lớn (chunk 5MB + dư)
    client_max_body_size 20M;
    # Timeout giữa hai lần đọc dữ liệu từ client (mỗi chunk nhỏ nên 120s là đủ)
    client_body_timeout 120s;
    # Timeout gửi response về client
    send_timeout 120s;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # Hỗ trợ React Router (SPA fallback)
        try_files $uri $uri/ /index.html;
        # Không cache index.html (tránh CDN/browser cache bản cũ)
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }
        # Cache assets có hash trong tên file 1 năm
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # Trang lỗi mặc định của Nginx
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }

    # Proxy API - cấu hình đặc biệt cho upload file
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Tắt buffering request để dữ liệu được stream trực tiếp tới backend
        # → progress bar XHR sẽ cập nhật chính xác từng chunk
        proxy_request_buffering off;

        # Timeout khi backend xử lý (merge chunk có thể mất vài giây)
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
        proxy_connect_timeout  30s;
    }
}
