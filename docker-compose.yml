services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3001:80"
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8081:8080"
    env_file:
      - ./backend/.env
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - APP_UPLOAD_DIR=/app/uploads
    volumes:
      - backend_uploads:/app/uploads
    restart: unless-stopped

volumes:
  backend_uploads:
