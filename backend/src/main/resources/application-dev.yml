spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  servlet:
    multipart:
      max-file-size: 1GB
      max-request-size: 1GB

server:
  port: 8080
  error:
    include-stacktrace: never
  tomcat:
    max-swallow-size: -1
    max-http-form-post-size: -1

app:
  admin:
    username: admin
    password: Mh123#@!
    jwt:
      secret: dearbook-admin-secret-key-32chars!!
  jwt:
    secret: your-256-bit-secret-your-256-bit-secret-for-local-dev-only
    expiration-ms: 86400000

google:
  client-id: ${GOOGLE_CLIENT_ID:your-google-client-id.apps.googleusercontent.com}
  aws:
    s3:
      bucket-name: ${AWS_S3_BUCKET_NAME:dearbook-assets}
      region: ${AWS_REGION:ap-southeast-1}
    credentials:
      access-key: ${AWS_ACCESS_KEY_ID:your-access-key}
      secret-key: ${AWS_SECRET_ACCESS_KEY:your-secret-key}
