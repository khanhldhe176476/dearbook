spring.application.name=dearbook-backend

server.port=${PORT:8080}

# ── Database ──────────────────────────────────────────────────────────
# PostgreSQL (production) — set DB_URL, DB_USERNAME, DB_PASSWORD env vars
# H2 in-memory (local dev) — used automatically when DB_URL is not set
spring.datasource.url=${DB_URL:jdbc:h2:mem:dearbook;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 console for local debugging
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ── Admin credentials — override in production via environment variables ──
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:Mh123#@!}
app.admin.jwt.secret=${ADMIN_JWT_SECRET:dearbook-admin-secret-key-32chars!!}
app.jwt.secret=${JWT_SECRET:your-256-bit-secret-your-256-bit-secret-for-local-dev-only}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ── Max Request Sizes (for large PDF Base64 payloads) ─────────────────
server.tomcat.max-swallow-size=500MB
server.tomcat.max-http-form-post-size=500MB
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

# ── Character Encoding ────────────────────────────────────────────────
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
spring.http.encoding.charset=UTF-8
spring.http.encoding.enabled=true
spring.http.encoding.force=true