<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Book Test</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #1e293b, #334155, #1e293b);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
    }

    .scene {
      width: 100vw;
      height: 100vh;
      perspective: 2500px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .book {
      width: 700px;
      height: 900px;
      transform-style: preserve-3d;
      transform: rotateX(-10deg) rotateY(-25deg) scale(0.85);
      transition: transform 0.3s ease-out;
    }

    .book-container {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
    }

    .page {
      position: absolute;
      width: 350px;
      height: 900px;
      background: white;
      box-shadow: 5px 5px 30px rgba(0,0,0,0.3);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      color: #333;
    }

    .page-left {
      left: 0;
      border-radius: 0 6px 6px 0;
      transform-origin: right center;
    }

    .page-right {
      right: 0;
      border-radius: 6px 0 0 6px;
      transform-origin: left center;
    }

    .spine {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%) translateZ(-25px);
      width: 50px;
      height: 900px;
      background: linear-gradient(to right, #4b5563, #374151, #4b5563);
      border-radius: 6px 0 0 6px;
      box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .spine-text {
      writing-mode: vertical-rl;
      color: white;
      font-weight: bold;
      font-size: 16px;
    }

    .center-shadow {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 4px;
      height: 900px;
      background: linear-gradient(to right, rgba(0,0,0,0.2), transparent, rgba(0,0,0,0.2));
      filter: blur(2px);
      z-index: 10;
      pointer-events: none;
    }

    .controls {
      position: fixed;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.4);
      backdrop-filter: blur(20px);
      padding: 16px 24px;
      border-radius: 50px;
      display: flex;
      gap: 12px;
      align-items: center;
      border: 1px solid rgba(255,255,255,0.1);
    }

    button {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(255,255,255,0.2);
      border: none;
      color: white;
      font-size: 20px;
      cursor: pointer;
      transition: all 0.2s;
    }

    button:hover:not(:disabled) {
      background: rgba(255,255,255,0.3);
      transform: scale(1.05);
    }

    button:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    .page-info {
      color: white;
      font-weight: 600;
      padding: 0 16px;
      min-width: 80px;
      text-align: center;
    }

    .status {
      position: fixed;
      top: 40px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.4);
      backdrop-filter: blur(20px);
      padding: 12px 24px;
      border-radius: 30px;
      border: 1px solid rgba(255,255,255,0.1);
    }

    @keyframes flip-right {
      0% { transform: rotateY(0deg); }
      100% { transform: rotateY(180deg); }
    }

    @keyframes flip-left {
      0% { transform: rotateY(0deg); }
      100% { transform: rotateY(-180deg); }
    }

    .flipping-right {
      animation: flip-right 0.6s cubic-bezier(0.45, 0.05, 0.55, 0.95) forwards;
    }

    .flipping-left {
      animation: flip-left 0.6s cubic-bezier(0.45, 0.05, 0.55, 0.95) forwards;
    }
  </style>
</head>
<body>
  <div class="status">
    <div style="font-size: 14px; font-weight: 600;">✅ 3D Book Viewer - Test Mode</div>
  </div>

  <div class="scene">
    <div class="book" id="book">
      <div class="book-container">
        <!-- Spine -->
        <div class="spine">
          <div class="spine-text">MY BOOK</div>
        </div>

        <!-- Left Page -->
        <div class="page page-left" id="pageLeft">
          📖 Left Page<br>
          <small style="font-size: 14px; margin-top: 10px; display: block;">Page 1</small>
        </div>

        <!-- Right Page -->
        <div class="page page-right" id="pageRight">
          📚 Right Page<br>
          <small style="font-size: 14px; margin-top: 10px; display: block;">Page 2</small>
        </div>

        <!-- Center Shadow -->
        <div class="center-shadow"></div>
      </div>
    </div>
  </div>

  <div class="controls">
    <button id="prevBtn">‹</button>
    <div class="page-info">
      <span id="currentPage">1</span> / 5
    </div>
    <button id="nextBtn">›</button>
  </div>

  <script>
    let currentPage = 1;
    const totalPages = 5;
    const book = document.getElementById('book');
    const pageLeft = document.getElementById('pageLeft');
    const pageRight = document.getElementById('pageRight');
    const currentPageEl = document.getElementById('currentPage');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');

    let isFlipping = false;

    function updatePages() {
      currentPageEl.textContent = currentPage;
      
      if (currentPage === 1) {
        pageLeft.innerHTML = '📖 Cover<br><small style="font-size: 14px; margin-top: 10px; display: block;">Front</small>';
        pageRight.innerHTML = '📚 Page 1<br><small style="font-size: 14px; margin-top: 10px; display: block;">Introduction</small>';
      } else {
        const leftPageNum = (currentPage - 1) * 2;
        const rightPageNum = leftPageNum + 1;
        pageLeft.innerHTML = `📄 Page ${leftPageNum}<br><small style="font-size: 14px; margin-top: 10px; display: block;">Content</small>`;
        pageRight.innerHTML = `📄 Page ${rightPageNum}<br><small style="font-size: 14px; margin-top: 10px; display: block;">Content</small>`;
      }

      prevBtn.disabled = currentPage === 1 || isFlipping;
      nextBtn.disabled = currentPage === totalPages || isFlipping;
    }

    nextBtn.addEventListener('click', () => {
      if (currentPage < totalPages && !isFlipping) {
        isFlipping = true;
        pageRight.classList.add('flipping-right');
        
        setTimeout(() => {
          currentPage++;
          updatePages();
          pageRight.classList.remove('flipping-right');
          isFlipping = false;
        }, 600);
      }
    });

    prevBtn.addEventListener('click', () => {
      if (currentPage > 1 && !isFlipping) {
        isFlipping = true;
        pageLeft.classList.add('flipping-left');
        
        setTimeout(() => {
          currentPage--;
          updatePages();
          pageLeft.classList.remove('flipping-left');
          isFlipping = false;
        }, 600);
      }
    });

    // Mouse drag to rotate
    let isDragging = false;
    let startX = 0;
    let startY = 0;
    let rotateY = -25;
    let rotateX = -10;

    book.addEventListener('mousedown', (e) => {
      isDragging = true;
      startX = e.clientX;
      startY = e.clientY;
      book.style.cursor = 'grabbing';
    });

    document.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      
      const deltaX = e.clientX - startX;
      const deltaY = e.clientY - startY;
      
      rotateY = Math.max(-60, Math.min(60, rotateY + deltaX * 0.3));
      rotateX = Math.max(-30, Math.min(10, rotateX - deltaY * 0.2));
      
      book.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale(0.85)`;
      
      startX = e.clientX;
      startY = e.clientY;
    });

    document.addEventListener('mouseup', () => {
      isDragging = false;
      book.style.cursor = 'grab';
    });

    book.style.cursor = 'grab';
    updatePages();

    console.log('✅ 3D Book Test Ready!');
    console.log('- Drag to rotate');
    console.log('- Click arrows to flip pages');
  </script>
</body>
</html>
